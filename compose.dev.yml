services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5174:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://app:8000
    depends_on:
      app:
        condition: service_healthy

  app:
    build: backend
    working_dir: /root
    command: pipenv run uvicorn --app-dir src main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/src:/root/src
    ports:
      - "8888:8000"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: ${DB_DATABASE:-callstats}
      DB_SCHEMA: call_stats
      DB_PORT: 5432
      DB_HOST: database
      ADMIN_PASSWORD: admin
      MEMBER_PASSWORD: member
      TOKEN_SECRET: dev-secret
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  database:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${DB_DATABASE:-callstats}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata_dev:
  frontend_node_modules:
